<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Super cool game!1!">
        <script type="module" src="../Scripts/main.js" defer></script>
        <link rel="stylesheet" href="../Style/Game.css">
        <title>Fun Aventure Game :)</title>
    </head>
    <body>
        <header>
            <h1>My cool game :) YAY!!!</h1>
        </header>

        <div id="Game-content">
            <img id="Game-Picture" src="../Images/placeholder.png" alt="This is where the game's image should be :)">
            <div id="Menu" class="hide">
                <h1 font-size="24px">Main Menu!</h1>

                <div class="Stat-pane" id="Intelligence-pane">
                    <img class="Stat-icon" src="../Images/Intelligence.jpg" alt="Intelligence icon">
                    <p id="Intelligence-tag">Intelligence: 0</p>
                    <button class="Stat-up-button" id="Intelligence-button">+</button>
                    <button class="Stat-down-button" id="Intelligence-button">-</button>
                </div>
                <div class="Stat-pane" id="Constitution-pane">
                    <img class="Stat-icon" src="../Images/Constitution.png" alt="Constitution icon">
                    <p id="Constitution-tag">Constitution: 0</p>
                    <button class="Stat-up-button" id="Constitution-button">+</button>
                    <button class="Stat-down-button" id="Constitution-button">-</button>
                </div>
                <div class="Stat-pane" id="Charisma-pane">
                    <img class="Stat-icon" src="../Images/Charisma.jpg" alt="Charisma icon">
                    <p id="Charisma-tag">Charisma: 0</p>
                    <button class="Stat-up-button" id="Charisma-button">+</button>
                    <button class="Stat-down-button" id="Charisma-button">-</button>
                </div>
                <div class="Stat-pane" id="Dexterity-pane">
                    <img class="Stat-icon" src="../Images/Dexterity.png" alt="Dexterity icon">
                    <p id="Dexterity-tag">Dexterity: 0</p>
                    <button class="Stat-up-button" id="Dexterity-button">+</button>
                    <button class="Stat-down-button" id="Dexterity-button">-</button>
                </div>
                <div class="Stat-pane" id="MEAT!-pane">
                    <img class="Stat-icon" src="../Images/MEAT!.png" alt="MEAT! icon">
                    <p id="MEAT!-tag">MEAT!: 0</p>
                    <button class="Stat-up-button" id="MEAT!-button">+</button>
                    <button class="Stat-down-button" id="MEAT!-button">-</button>
                </div>

                <div id="Stat-managment-pane">
                    <p id="Name-tag">Name: </p>
                    <p id="Level-tag">Level: 1</p>
                    <p id="Points-tag">Available Points: 0</p>
                    <button id="Reset-button">RESET STATS</button>
                </div>
                
            </div>
            <div id="Gui">
                <button id="Menu-button" class="Gui-button">MENU</button>
                <select name="Event-select" id="Event-select">
                    <option value="">--pick something :)--</option>
                </select>
                <button id="Confirm-button" class="Gui-button">CONFIRM</button>
            </div>
        </div>

        <footer>By Alex~ </footer>
    </body>
</html>
